name: CI Quality Assurance & Automated Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Static Typecheck
        run: npx tsc --noEmit

      - name: Run Automated Vitest Suites
        run: npm run test

      - name: Verify Production Bundle
        run: npm run build
